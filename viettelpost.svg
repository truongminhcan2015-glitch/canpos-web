<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100%">
  <rect width="300" height="100" rx="12" fill="#ffffff"/>
  <g transform="translate(15, 20)">
    <!-- Viettel Brand Text -->
    <text x="0" y="46" font-family="'Be Vietnam Pro', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="44" fill="#ee0033" letter-spacing="-1.5">viettel</text>
    <!-- Post text badge -->
    <text x="148" y="46" font-family="'Be Vietnam Pro', 'Montserrat', Arial, sans-serif" font-weight="800" font-size="34" fill="#ff6600" letter-spacing="1">post</text>
    <!-- Delivery speed swoosh -->
